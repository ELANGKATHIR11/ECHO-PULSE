[package]
name = "echopulsenet-desktop"
version = "2.6.0"
description = "EchoPulseNet: Autonomous Marine Sonar Intelligence & Debris Detection SaaS"
authors = ["EchoPulseNet Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
